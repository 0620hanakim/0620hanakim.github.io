<section>
  <div class="container">
    <h2>프로그램 문의</h2>
    <p style="margin-bottom:1.3em;">
      궁금하신 점은 아래 양식 또는 <b>future.innovation.policy.lab@gmail.com</b>으로 메일 주세요.
    </p>
    <form class="contact-form" name="contact" method="POST" data-netlify="true">
      <input type="hidden" name="form-name" value="contact">
      <label for="name">이름&nbsp;/&nbsp;기관</label>
      <input id="name" type="text" name="name" required>
      <label for="email">이메일</label>
      <input id="email" type="email" name="email" required>
      <label for="course">관심 과정</label>
      <select id="course" name="course">
        <option value="senior">AI 시니어·초보자 과정</option>
        <option value="youth">ChatGPT 연구방법(중·고)</option>
        <option value="custom">맞춤 컨설팅/워크숍</option>
      </select>
      <label for="message">세부 문의 사항</label>
      <textarea id="message" name="message" rows="6" placeholder="희망 일정, 인원, 목표 등을 적어주세요." required></textarea>
      <button type="submit">보내기</button>
    </form>
  </div>
</section>
